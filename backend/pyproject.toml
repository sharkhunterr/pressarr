[project]
name = "pressarr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0,<2.1",
    "aiosqlite>=0.20.0",
    "alembic>=1.13",
    "pydantic>=2.5,<3",
    "httpx>=0.27",
    "APScheduler>=3.10,<4",
    "PyMuPDF>=1.24",
    "rapidfuzz>=3.6",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "F821",   # SQLAlchemy string forward references in Mapped types
    "UP042",  # StrEnum suggestion - keep str+Enum for Pydantic compat
    "UP046",  # Generic[T] syntax - keep for Python 3.12 compat
]
